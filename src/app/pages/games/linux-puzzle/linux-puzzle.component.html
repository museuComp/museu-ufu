<div class="puzzle-container">
  <div *ngIf="!gameStarted" class="puzzle-header">
    <h1>Puzzle de Linux</h1>
    <p>
      Ajude Tux, mascote do sistema operacional Linux, a chegar no seu amigo GNU
      GPL e a adquirir as 4 liberdades essenciais:
      <b>rodar, estudar, modificar e redistribuir</b>
    </p>
    <div class="start-screen">
      <button class="start-button" (click)="startGame()">Começar Puzzle</button>
    </div>
  </div>

  <div *ngIf="gameStarted" class="puzzle-content">
    <div class="question">
      <h2>{{ puzzles[currentPuzzle].question }}</h2>
    </div>
  </div>
</div>
