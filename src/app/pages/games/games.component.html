<div class="games-container">
  <h1 class="games-title">Jogos Educativos</h1>
  <div class="games-grid">
    <!-- Página de jogos renderizada a partir da lista definida no componente TypeScript -->
    <div
      class="game-card"
      *ngFor="let game of games"
      [routerLink]="game.route"
    >
      <div class="game-icon">
        <i [class]="game.iconClass"></i>
      </div>

      <h2>{{ game.title }}</h2>
      <p>{{ game.description }}</p>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
