<main class="statistics-page">
  <header class="page-header">
    <div class="header-badge" aria-hidden="true">
      <mat-icon>insights</mat-icon>
      <span>Métricas e Transparência</span>
    </div>
    <h1 class="page-title">{{ 'statistics.title' | transloco }}</h1>
    <p class="page-subtitle">{{ 'statistics.subtitle' | transloco }}</p>
  </header>

  <mat-tab-group
    class="statistics-tabs"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onTabChange($event)"
    animationDuration="250ms"
    aria-label="Abas do painel de estatísticas"
  >
    <!-- TAB 1: Visão Geral -->
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="tab-label-content">
          <mat-icon aria-hidden="true">dashboard</mat-icon>
          <span>{{ 'statistics.tabs.overview' | transloco }}</span>
        </div>
      </ng-template>

      <div class="tab-content">
        <app-stat-kpi-cards
          [kpis]="stats.kpis()"
          [isLoading]="stats.isLoading()"
        />

        <app-stat-charts
          [categoryData]="stats.categoryDistribution()"
          [temporalData]="stats.temporalData()"
          [isLoading]="stats.isLoading()"
        />

        <app-stat-recent-activity
          [items]="stats.recentActivity()"
          [limit]="5"
          [showViewAll]="true"
          (viewAllClicked)="switchToDetailsTab()"
        />
      </div>
    </mat-tab>

    <!-- TAB 2: Detalhamento do Acervo -->
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="tab-label-content">
          <mat-icon aria-hidden="true">table_view</mat-icon>
          <span>{{ 'statistics.tabs.details' | transloco }}</span>
        </div>
      </ng-template>

      <div class="tab-content">
        <app-stat-filters
          [activePeriod]="stats.activePeriod()"
          [activeType]="stats.activeType()"
          [activeCategory]="stats.activeCategory()"
          [searchTerm]="stats.searchTerm()"
          [categories]="stats.availableCategories()"
          (periodChange)="stats.setPeriod($event)"
          (typeChange)="stats.setType($event)"
          (categoryChange)="stats.setCategory($event)"
          (searchChange)="stats.setSearch($event)"
          (resetFilters)="stats.clearFilters()"
        />

        <app-stat-detail-table
          [items]="stats.filteredContent()"
          [authorsRanking]="stats.authorsRanking()"
        />

        <app-stat-recent-activity
          [items]="stats.recentActivity()"
          [limit]="10"
          [showViewAll]="false"
        />
      </div>
    </mat-tab>

    <!-- TAB 3: Relatório de Visitação (Looker Studio) -->
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="tab-label-content">
          <mat-icon aria-hidden="true">analytics</mat-icon>
          <span>{{ 'statistics.tabs.analytics' | transloco }}</span>
        </div>
      </ng-template>

      <div class="tab-content">
        <app-stat-looker />
      </div>
    </mat-tab>
  </mat-tab-group>
</main>
