<ng-container *ngIf="newsList$ | async as newsItems; else loading">
  <div class="news-list" *ngIf="newsItems.length > 0; else empty">
    <mat-card *ngFor="let news of newsItems" class="news-card">

      <a
        [routerLink]="nav.route('news/detail/' + news.id)"
        class="news-card-image-link">
        <div class="news-card-image-container">
          <img
            [src]="news.summary.mainImage"
            [alt]="news.summary.title"
            class="news-main-image-card">
        </div>
      </a>

      <div class="news-card-content-area">
        <span class="news-category">
          {{ news.summary.category }}
        </span>

        <a
          class="news-title-link"
          [routerLink]="nav.route('news/detail/' + news.id)">
          <h3 class="news-title-text">
            {{ news.summary.title }}
          </h3>
        </a>

        <div class="news-description">
          <p>{{ news.summary.description }}</p>
        </div>
      </div>

      <div class="news-card-action-container">
        <a
          [routerLink]="nav.route('news/detail/' + news.id)"
          class="btn-card-action">
          Ler Notícia
        </a>
      </div>

    </mat-card>
  </div>
</ng-container>

<ng-template #loading>
  <div
    class="loading-or-empty-container"
    role="status"
    aria-live="polite">
    Carregando notícias...
  </div>
</ng-template>

<ng-template #empty>
  <div
    class="loading-or-empty-container"
    role="status"
    aria-live="polite">
    Nenhuma notícia encontrada.
  </div>
</ng-template>
