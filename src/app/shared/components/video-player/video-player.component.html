<div class="video-player-container">
    <div class="video-player-wrapper">
        <iframe
            [src]="videoUrl"
            frameBorder="0"
            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            [title]="videoTitle"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </div>
</div>
