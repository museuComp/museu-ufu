<app-barra-brasil></app-barra-brasil>
<header class="br-header" id="header" data-sticky="data-sticky">
	<div class="container" *transloco="let t">
		<div class="row d-flex align-items-start justify-content-between">
			<div class="col-md-auto col-9 d-flex align-items-start">
				<button class="navbar-toggler me-3" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
					<span class="text-primary">
						<i class="fas fa-bars"></i>
					</span>
				</button>

				<div class="region region-nav-branding">
					<div class="marca">
						<div class="logo" [class.scrolled]="isScrolled">
							<a [routerLink]="nav.route('home')" [title]="t('header.logo')" rel="home">
								<img src="public/logos/museu-computacao-azul1.png" alt="Logo">
							</a>
						</div>	
					</div>
				</div>
			</div>

			<div class="col-md-auto col-3">
				<div class="acessibilidade">
					<div class="d-none d-md-block">
						<p class="d-flex align-items-center justify-content-md-end my-3 my-md-1">
						<div class="header-accessibility">
							<a [routerLink]="nav.route('accessibility')" [title]="t('breadcrumb.accessibility')">{{t('breadcrumb.accessibility')}}</a>
						</div>
						<a (click)="decreaseZoom()" href="javascript:void(0)" [title]="t('header.accessibility.zoom_out')">A-</a>
						<a (click)="resetZoom()" href="javascript:void(0)" [title]="t('header.accessibility.reset')">A</a>
						<a (click)="increaseZoom()" href="javascript:void(0)" [title]="t('header.accessibility.zoom_in')">A+</a>
						<a (click)="toggleContrast()" href="javascript:void(0)" [title]="t('header.accessibility.constrast')">
							<i class="fas fa-adjust"></i>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</header>
