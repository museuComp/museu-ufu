<div class="dashboard-container">
  <div class="dashboard-header">
    <div *ngIf="user() as currentUser">
      <h1 class="welcome-title">Dashboard de Gerenciamento</h1>
      <p class="welcome-subtitle">Bem-vindo, {{ currentUser.name }}!</p>
    </div>
    <div class="buttons-container">
       <button mat-stroked-button color="warn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Sair
    </button>
    </div>
  </div>
  <div class="dashboard-section-buttons">
    <button mat-stroked-button color="primary" (click)="toggleView('news')">
        <mat-icon>article</mat-icon>
        Notícias
    </button>
    <button mat-stroked-button color="primary" (click)="toggleView('videos')">
        <mat-icon>video_library</mat-icon>
        Vídeos
    </button>
    <button mat-stroked-button color="primary" (click)="toggleView('personalities')">
        <mat-icon>face</mat-icon>
        Personalidades
    </button>
  </div>

  <div class="dashboard-grid">
    <div class="management-container" *ngIf="isAdmin()">
      <div class="management-header">
        <h2>Gerenciar {{mapper[currentView]}}</h2>
        <button mat-flat-button color="primary" [routerLink]="['..',currentView, 'create']">
          <mat-icon>add</mat-icon>
          Criar {{mapper[currentView]}}
        </button>
      </div>
      <router-outlet></router-outlet> 
  </div>
</div>
