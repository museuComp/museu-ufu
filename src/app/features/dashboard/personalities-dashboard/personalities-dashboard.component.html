<!-- Trocado news-list para personalities-list e loadingNews para loadingPersonalities -->
<div class="personalities-list" cdkDropList (cdkDropListDropped)="onDrop($event)" *ngIf="!isLoading; else loadingPersonalities">
    <!-- Trocado news-row para personality-row -->
    <div *ngFor="let personality of personalitiesItems; trackBy: trackByPersonalityId" class="personality-row" cdkDrag>
        <div class="personality-row-header" style="display: flex; align-items: center; gap: 12px; width: 100%;">
            <mat-icon cdkDragHandle style="cursor: grab; color: #888;">drag_indicator</mat-icon>

            <a [routerLink]="['/personalities/detail', personality.id]" style="flex: 1; text-decoration: none;">
                <!-- Trocado news-title para personality-title -->
                <span class="personality-title">{{ personality.summary.title }}</span>
            </a> 

            <div class="list-item-actions">
              <button mat-icon-button color="primary" (click)="editPersonality(personality)"
                [attr.aria-label]="'Editar personalidade ' + personality.summary.title">
                <mat-icon>edit</mat-icon>
              </button>

              <button mat-icon-button color="warn" (click)="deletePersonality(personality)"
                [attr.aria-label]="'Excluir personalidade ' + personality.summary.title">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
        </div>
        <!-- Trocado news-category para personality-category -->
        <div class="personality-category" style="margin-left: 36px;">
            {{ personality.summary.category }}
        </div>

    </div>
</div>

<!-- Trocado loadingNews para loadingPersonalities -->
<ng-template #loadingPersonalities>
    <div class="loading-or-empty-container">
        <p>Carregando personalidades...</p>
    </div>
</ng-template>
